<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI API Gateway - Subscription-based quota allocation for Claude, Gemini, OpenAI" />
    <title>Sub2API - AI API Gateway</title>
    <style>
      /* Critical CSS: prevent FOUC with minimal loading skeleton */
      #app:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0A0F1C;
      }
      #app:empty::after {
        content: '';
        width: 32px;
        height: 32px;
        border: 3px solid #1e293b;
        border-top-color: #0066FF;
        border-radius: 50%;
        animation: spin .6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
