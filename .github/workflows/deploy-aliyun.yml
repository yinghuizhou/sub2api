name: Deploy to Aliyun Server

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  # 阿里云服务器配置
  ALIYUN_HOST: 47.76.82.51
  ALIYUN_USER: root
  DEPLOY_PATH: /opt/sub2api
  # Docker配置
  IMAGE_NAME: sub2api
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # 构建阶段
  # ============================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

  # ============================================================
  # 部署阶段
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALIYUN_SSH_KEY }}
          log-public-key: false

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.ALIYUN_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Aliyun
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 开始部署到阿里云服务器 ${{ env.ALIYUN_HOST }} ==="

          # 设置远程命令
          REMOTE_CMD="
            set -e
            echo '=== 登录 GitHub Container Registry ==='
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            echo '=== 切换到部署目录 ==='
            cd ${{ env.DEPLOY_PATH }}

            echo '=== 备份当前配置 ==='
            if [ -f .env ]; then
              cp .env .env.backup.$(date +%Y%m%d_%H%M%S)
            fi

            echo '=== 拉取最新镜像 ==='
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest

            echo '=== 停止旧服务 ==='
            docker compose -f docker-compose.local.yml down || true

            echo '=== 清理旧镜像 ==='
            docker image prune -af --filter "until=24h" || true

            echo '=== 更新镜像标签 ==='
            docker tag ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest weishaw/sub2api:latest

            echo '=== 启动新服务 ==='
            docker compose -f docker-compose.local.yml up -d

            echo '=== 等待服务启动 ==='
            sleep 10

            echo '=== 健康检查 ==='
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo '✅ 服务启动成功'
            else
              echo '❌ 健康检查失败，查看日志：'
              docker compose -f docker-compose.local.yml logs --tail=50 sub2api
              exit 1
            fi

            echo '=== 部署完成 ==='
          "

          # 执行远程部署
          ssh -o StrictHostKeyChecking=no ${{ env.ALIYUN_USER }}@${{ env.ALIYUN_HOST }} "$REMOTE_CMD"

      - name: Verify deployment
        run: |
          echo "=== 验证部署 ==="
          sleep 5
          curl -sf http://${{ env.ALIYUN_HOST }}:8080/health && echo "✅ 部署验证成功" || (echo "❌ 部署验证失败" && exit 1)

      - name: Notify success
        if: success()
        run: |
          echo "✅ 部署成功！"
          echo "访问地址: http://${{ env.ALIYUN_HOST }}:8080"
          echo "镜像版本: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ 部署失败，执行回滚..."
          ssh -o StrictHostKeyChecking=no ${{ env.ALIYUN_USER }}@${{ env.ALIYUN_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            docker compose -f docker-compose.local.yml down
            docker compose -f docker-compose.local.yml up -d
          " || true
