# =============================================================================
# 成都服务器 Nginx 配置 - llm.quanminai.cloud
# 反向代理到香港服务器高可用集群
# =============================================================================
#
# 部署步骤：
# 1. 上传此文件到成都服务器: /etc/nginx/conf.d/quanminai.conf
# 2. 申请 SSL 证书: certbot --nginx -d llm.quanminai.cloud
# 3. 测试配置: nginx -t
# 4. 重载 Nginx: systemctl reload nginx
#
# =============================================================================

# HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name llm.quanminai.cloud;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务器（反向代理到香港）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name llm.quanminai.cloud;

    # SSL 证书配置（certbot 会自动填充）
    # ssl_certificate /etc/letsencrypt/live/llm.quanminai.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/llm.quanminai.cloud/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL 配置（手动配置时使用）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端请求大小限制
    client_max_body_size 100M;

    # 反向代理到香港服务器高可用集群
    location / {
        # 香港服务器地址（高可用集群入口）
        proxy_pass http://47.76.82.51:8888;

        # 基本代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 流式响应支持（SSE/Streaming）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # 超时配置（适合 AI API 长时间响应）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 错误处理
        proxy_intercept_errors off;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # 健康检查端点（不缓存）
    location /health {
        access_log off;
        proxy_pass http://47.76.82.51:8888/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # 错误页面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"code": 503, "message": "服务暂时不可用，请稍后重试"}';
        add_header Content-Type application/json;
    }
}
