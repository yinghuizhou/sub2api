# 3proxy configuration template for Sub2API VPN Proxy System
# Placeholders replaced at deploy time:
#   {{PORT}}   - SOCKS5 listen port (e.g., 10801)
#   {{TUN_IP}} - Local IP of the OpenVPN TUN interface
#   {{NAME}}   - Instance name for log identification
#
# This config creates a SOCKS5 proxy bound to 0.0.0.0:{{PORT}}
# that routes all outbound traffic through the VPN tunnel IP.

# Logging
log /var/log/sub2api-vpn/3proxy-{{NAME}}.log D
rotate 7

# Timeouts (seconds)
timeouts 1 5 30 60 180 1800 15 60

# DNS resolution
nserver 8.8.8.8
nserver 1.1.1.1
nscache 65536

# Max connections per instance
maxconn 128

# Bind outgoing connections to the VPN tunnel IP
# This ensures traffic exits through the VPN, not the default route
external {{TUN_IP}}

# Listen on all interfaces at the designated port
# The Go backend connects to 127.0.0.1:{{PORT}}
# No authentication needed - access is local only via firewall rules
auth none

# SOCKS5 proxy
socks -p{{PORT}} -i0.0.0.0
