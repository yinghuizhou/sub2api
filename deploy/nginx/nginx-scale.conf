# =============================================================================
# Nginx Configuration for Sub2API High Availability (Scale Mode)
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream info
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream: $upstream_addr '
                      'upstream_status: $upstream_status '
                      'upstream_response_time: $upstream_response_time '
                      'request_time: $request_time';

    access_log  /var/log/nginx/access.log  main;

    # Performance tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream backend servers (Docker Compose service name with DNS resolution)
    upstream sub2api_backend {
        # Load balancing algorithm: least_conn (best for AI API with varying response times)
        least_conn;

        # Docker Compose service name (DNS will resolve to all scaled instances)
        server sub2api:8080 max_fails=3 fail_timeout=30s;

        # Keep-alive connections to backend
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;
}
