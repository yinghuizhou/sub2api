# =============================================================================
# Sub2API Dev Container - Docker Compose
# =============================================================================
# Services: app (dev container) + PostgreSQL + Redis
# VS Code connects to the "app" service for full-stack development.
# =============================================================================

services:
  # ===========================================================================
  # Development Container (Go + Node + pnpm)
  # ===========================================================================
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      # Persist Go module cache for faster rebuilds
      - go-mod-cache:/home/vscode/go/pkg/mod
      # Persist Go build cache
      - go-build-cache:/home/vscode/.cache/go-build
      # Persist pnpm store
      - pnpm-store:/home/vscode/.local/share/pnpm/store
      # Persist node_modules (avoid slow host mount)
      - node-modules:/workspace/frontend/node_modules
    environment:
      # Server
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=debug
      - AUTO_SETUP=true
      - RUN_MODE=standard
      # Database
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=sub2api
      - DATABASE_PASSWORD=devpassword
      - DATABASE_DBNAME=sub2api
      - DATABASE_SSLMODE=disable
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      # Admin (auto-created on first run)
      - ADMIN_EMAIL=admin@sub2api.local
      - ADMIN_PASSWORD=admin123
      # JWT (fixed for dev, avoids re-login after restart)
      - JWT_SECRET=dev-jwt-secret-do-not-use-in-production
      - JWT_EXPIRE_HOUR=720
      # Timezone
      - TZ=Asia/Shanghai
      # Go proxy
      - GOPROXY=https://goproxy.cn,direct
      - GOSUMDB=sum.golang.google.cn
      # Security (relaxed for dev)
      - SECURITY_URL_ALLOWLIST_ENABLED=false
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=true
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-dev
    # Keep container running for VS Code to attach
    command: sleep infinity

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=sub2api
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=sub2api
      - PGDATA=/var/lib/postgresql/data
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - sub2api-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - sub2api-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
  redis-data:
  go-mod-cache:
  go-build-cache:
  pnpm-store:
  node-modules:

# =============================================================================
# Networks
# =============================================================================
networks:
  sub2api-dev:
    driver: bridge
